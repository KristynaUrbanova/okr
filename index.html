<!DOCTYPE html>
<html lang="cs">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<title>OKRs</title>

<style>
body {
  font-family: Arial;
  display: flex;
  gap: 40px;
  padding: 20px;
}

.left {
  border: 2px solid #ff4da6;
  padding: 20px;
  border-radius: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 80px);
  gap: 10px;
  margin-top: 10px;
}

.box {
  width: 80px;
  height: 80px;
  border: 2px solid #4CAF50;
  display: flex;
  align-items: center;
  justify-content: center;
}

.right {
  display: flex;
  flex-wrap: wrap;
  width: 260px;
  gap: 10px;
}

.circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  position: relative;
}

.circle img {
  width: 30px;
  height: 30px;
  pointer-events: none;
}

.green { background: #4CAF50; }
.blue { background: #2f5b8f; }

.tooltip {
  visibility: hidden;
  position: absolute;
  bottom: 70px;
  background: black;
  color: white;
  padding: 10px;
  font-size: 12px;
  width: 250px;
  max-height: 200px;
  overflow-y: auto;
  text-align: left;
  border-radius: 8px;
}

.circle:hover .tooltip {
  visibility: visible;
}

button {
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="left">
  <h2>MOJE OKRs</h2>

  <label>Jméno:</label><br>
  <input id="name"><br>

  <div class="grid" id="grid"></div>

  <br>
  <label>Jiné aktivity:</label><br>
  <input id="other"><br>

  <button onclick="save()">Uložit</button>
</div>

<div class="right" id="circles"></div>

<script>

// SUPABASE SAFE INIT
if (!window.supabaseClient) {
  window.supabaseClient = window.supabase.createClient(
    "https://gunyhyihyqjlhvqgbnsb.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bnloeWloeXFqbGh2cWdibnNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MjQzMDUsImV4cCI6MjA5MjAwMDMwNX0.QfXTdO5cXaps-M8_QUKI-Smnz2LV5aLOs6I-c5DR1BE"
  );
}
var supabase = window.supabaseClient;


// DATA (IKONY + TEXTY)
const activities = [
  {label:"Budu makat na projektu", icon:"icons/laptop.png", color:"blue"},
  {label:"Udělám rozvojové aktivity", icon:"icons/student.png", color:"blue"},
  {label:"Zajedu na konferenci", icon:"icons/conference.png", color:"blue"},
  {label:"Zúčastním se focení", icon:"icons/camera.png", color:"blue"},
  {label:"Vyplním dotazníky", icon:"icons/form.png", color:"blue"},
  {label:"Půjdu alespoň na 2 celofiremní akce", icon:"icons/chat.png", color:"blue"},
  {label:"Zajdu na neofiko akci", icon:"icons/party.png", color:"blue"},
  {label:"Zajdu občas do kanceláře", icon:"icons/office.png", color:"blue"},
  {label:"Budu se o sebe starat", icon:"icons/selfcare.png", color:"blue"},
  {label:"Vytvoř si vlastní", icon:"icons/empty.png", color:"blue"},
  {label:"Hiring", color:"green"},
  {label:"Test Automation", color:"green"},
  {label:"Culture", color:"green"},
  {label:"Win Rate", color:"green"},
  {label:"Růst a rozvoj", color:"green"},
  {label:"AI Hub", color:"green"},
  {label:"T&E", color:"green"},
  {label:"Sales", color:"green", des:"Sales v našem kontextu není jen o „prodeji“, ale hlavně o budování dlouhodobých vztahů s klienty a hledání příležitostí, kde dokážeme přinést hodnotu.Součástí je aktivní vyhledávání nových projektů (lead generation), práce se stávajícími klienty a rozvoj spolupráce. Důležité je pochopit potřeby zákazníka a navrhnout řešení, které dává smysl jak z business, tak technologického pohledu.Sales zahrnuje i konzultace, workshopy a prezentaci našich služeb. Nejde jen o získání zakázky, ale o to být pro klienta partnerem, kterému věří a ke kterému se vrací.Velkou roli hraje také rozvoj existujících účtů – hledání nových příležitostí u současných klientů, rozšiřování spolupráce a zvyšování celkové hodnoty projektů.Cílem je nejen růst revenue, ale i otevírání nových rolí, služeb a příležitostí pro celý tým. Sales tak přímo ovlivňuje, na jakých projektech budeme pracovat a kam se firma posune dál."},
  {label:"People Care", color:"green"},
  {label:"Office Management", color:"green"},
  {label:"Marketing", color:"green"},
  {label:"Finance", color:"green"},
  {label:"Delivery", color:"green"}, 
  {label:"QE", color:"green"},
  {label:"Tesena Labs", color:"green"}
];

// CREATE CIRCLES
const container = document.getElementById("circles");

activities.forEach(a => {
  const div = document.createElement("div");
  div.className = `circle ${a.color}`;
  div.draggable = true;

  div.innerHTML = `
  ${a.icon 
    ? `<img src="${a.icon}">` 
    : `<span style="color:white;font-size:10px;text-align:center">${a.label}</span>`
  }
  <div class="tooltip">${a.label}</div>
`;

  div.ondragstart = e => {
    e.dataTransfer.setData("text/html", div.outerHTML);
  };

  container.appendChild(div);
});

// GRID
const grid = document.getElementById("grid");

for (let i = 0; i < 16; i++) {
  const box = document.createElement("div");
  box.className = "box";

  box.ondragover = e => e.preventDefault();

  box.ondrop = e => {
    e.preventDefault();
    if (box.children.length > 0) return;

    const data = e.dataTransfer.getData("text/html");
    box.innerHTML = data;

    const circle = box.querySelector(".circle");

  circle.onclick = () => {
    const clone = circle.cloneNode(true);

    // znovu nastavit drag
    clone.draggable = true;
    clone.ondragstart = ev => {
      ev.dataTransfer.setData("text/html", clone.outerHTML);
    };

    document.getElementById("circles").appendChild(clone);

    box.innerHTML = "";
  };
    };

  grid.appendChild(box);
}

// SAVE
async function save() {
  const name = document.getElementById("name").value;
  const other = document.getElementById("other").value;

  if (!name) {
    alert("Zadej jméno");
    return;
  }

  const boxes = document.querySelectorAll(".box");

  for (let b of boxes) {
    const activity = b.querySelector(".tooltip")?.innerText;

    if (activity) {
      await supabase.from('okr').insert({
        name: name,
        activity: activity,
        other: other
      });
    }
  }

  alert("Uloženo 🚀");

  let rows = [["Jmeno","Aktivita","Jine"]];

  data.forEach(r => {
    rows.push([r.name, r.activity, r.other || ""]);
  });

  let csv = rows.map(e => e.join(";")).join("\n");

  const blob = new Blob([csv]);
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "report.csv";
  a.click();
}

</script>

</body>
</html>
