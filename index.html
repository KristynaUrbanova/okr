  {label:"Hiring", color:"green",desc: "Hiring je zaměřený na budování kvalitního poolu kandidátů (analytické i automatizační role), kteří jsou připraveni na aktuální poptávky. Kombinuje aktivní i pasivní nábor a klade důraz na rychlý a přehledný proces. Důležitá je spolupráce se sales a delivery a také employer branding, který pomáhá přivádět nové kandidáty a zvyšovat úspěšnost náboru."},
  {label:"Test Automation", color:"green", desc: "Test Automation se zaměřuje na rozvoj automatizačních kompetencí v Teseně a jejich využití v delivery i sales. Cílem je budovat silnou komunitu Test Automation Engineers, sdílet know-how a zajišťovat vysokou kvalitu služeb.\n\nKlíčovou roli hraje vytvoření Test Automation Competence Centre, které sjednocuje znalosti, definuje role (TAE/STAE), career path a podporuje sdílení zkušeností – například formou workshopů, focus groups nebo interních setkání.\n\nDůležitá je také připravenost lidí na trh – tým pravidelně sleduje poptávky klientů a trendy a pomáhá testerům (např. na lavičce) rozvíjet relevantní dovednosti. Tím se zvyšuje jejich uplatnitelnost a snižuje čas mimo projekty.\n\nTest Automation zároveň podporuje sales – vytváří a aktualizuje popisy služeb, technologie a nabízí technický input do nabídek. Cílem je, aby bylo možné služby jednoduše a srozumitelně prodávat.\n\nSoučástí je i budování expertního know-how – například tvorba školení (Test Automation Architecture), workshopy nebo sdílení trendů formou blogů. Tým tak pomáhá posouvat firmu dopředu jak z pohledu technologií, tak businessu."},
  {label:"Culture", color:"green", desc: "Culture se zaměřuje na budování firemní kultury, spokojenosti zaměstnanců a prostředí, kde lidé chtějí pracovat. Tým zároveň zajišťuje organizaci firemních akcí a dohlíží na fungování samořídících principů napříč firmou.\n\nHlavním cílem pro rok 2026 je zavést funkční systém sběru a vyhodnocování zpětné vazby, který pomůže lépe reagovat na potřeby lidí. Důležitá je také vyšší účast na firemních akcích a udržení celkové spokojenosti zaměstnanců.\n\nSoučástí je i posílení povědomí o samořízení – vznikne školení na tyto principy, které bude součástí onboarding procesu. Tým bude zároveň pravidelně vyhodnocovat zpětnou vazbu a podle ní upravovat fungování.\n\nVelký důraz je kladen i na pestrost akcí – cílem je oslovit co nejširší spektrum lidí a pořádat alespoň dvě různé akce za kvartál mimo hlavní firemní eventy."},
  {label:"Win Rate", color:"green", desc: "Win Rate se zaměřuje na zvyšování úspěšnosti při získávání zakázek a celkovou efektivitu využití kapacit. Jde o klíčový ukazatel, který propojuje sales, delivery i nové služby a přímo ovlivňuje růst firmy.V oblasti bodyshoppingu je cílem dosahovat win rate na úrovni cca 35 % u existujících klientů a 15 % u nových akvizic. U nových produktů a služeb (QE, QM, Test Advisory, AI) mají jednotlivé týmy za úkol aktivně hledat způsoby, jak svou win rate zlepšit – centrální tým tyto iniciativy vyhodnocuje, prioritizuje a pomáhá s jejich realizací.Podobný přístup se uplatňuje i u Training & Events, kde se sledují konverze (např. newslettery, online kampaně nebo účast na školeních) a hledají se konkrétní způsoby jejich zlepšení. Součástí je i sjednocení a sledování win rate napříč oblastmi (včetně NPS a T&E) a systematická práce na jejich zvyšování.Důležitou součástí je také práce s kapacitami a billability (cílově > 78 %). Firma se snaží zajistit, aby strategické aktivity byly řešeny efektivně – ideálně lidmi na lavičce a s odpovídající senioritou.Win Rate iniciativa zahrnuje i konkrétní nástroje a aktivity, které podporují vyšší úspěšnost:– AI nástroj pro resource management, který páruje skillset lidí s aktuální poptávkou– zapojení delivery lidí do business developmentu (tzv. Delivery Driven BD)– využití skill matrix a AI pro doporučení rozvoje a lepší využití lidí– budování větší databáze kandidátů pro rychlejší reakci na poptávky– rozšiřování podpory dalších týmů (např. T&E, NPS) při zlepšování jejich konverzí.Cílem je nejen zvýšit win rate, ale i celkovou efektivitu fungování firmy – lépe využívat kapacity, rychleji reagovat na poptávky a systematicky zvyšovat úspěšnost napříč všemi oblastmi."},
  {label:"Růst a rozvoj", color:"green", desc: "Růst a rozvoj se zaměřuje na systematické řízení kompetencí lidí v Delivery a jejich dlouhodobý rozvoj. Cílem je mít přehled o tom, co kdo umí, kam se může posunout a jak efektivně využít kapacity napříč firmou.\n\nDůležitou součástí je vytvoření strukturovaného skill inventory (stromu dovedností), který přináší transparentní pohled na testerské kompetence. Díky tomu se snižuje riziko znalostních mezer, zpřehledňují se možnosti růstu a rozvoj už není řízen nahodile, ale systematicky.\n\nStrom dovedností se stává standardem v Delivery – každá oblast má svého ownera, data jsou udržovaná a propojená s reálným rozvojem lidí. Součástí je i napojení na onboarding (nováčci vyplňují profil během zkušebky) a využití jako podklad pro roční review.\n\nDůležitý je také vztah k lavičce (bench) – aktivity jsou navázané na konkrétní oblasti stromu, což pomáhá cílenému rozvoji. Pravidelný reporting pak sleduje adopci, identifikuje nevyužívané oblasti a pomáhá celý systém dál zlepšovat."},
  {label:"AI Hub", color:"green", desc: "AI Hub se zaměřuje na smysluplné využití umělé inteligence v rámci Teseny – jak pro zvyšování efektivity interních procesů, tak pro rozvoj kompetencí testerů. Cílem je vracet zkušenosti a know-how z práce s AI zpět do firmy a sdílet je napříč týmy.Důležitou rolí AI Hubu je udržet testerskou roli relevantní v době, kdy se vývoj softwaru výrazně mění díky AI. To znamená nejen sledovat nové trendy, ale hlavně učit testery, jak AI efektivně využívat v každodenní práci – od analýzy, přes návrh testů až po automatizaci.AI Hub zároveň identifikuje příležitosti, kde může AI zlepšit interní fungování firmy. Na základě analýzy procesů navrhuje konkrétní řešení, která mají reálný dopad a přinášejí vyšší efektivitu.Součástí je také systematické sdílení znalostí – ověřená řešení jsou dokumentována jako best practices, aby je mohli využívat i ostatní. Workshopy a pracovní skupiny pak pomáhají šířit zkušenosti, testovat nové přístupy a vyhodnocovat jejich přínos.Cílem AI Hubu není jen experimentovat s AI, ale přinášet konkrétní hodnotu – zvyšovat efektivitu, rozvíjet lidi a posouvat firmu směrem k modernímu způsobu práce."},
  {label:"T&E", color:"green", desc: "T&E (Training & Events) se zaměřuje na poskytování školení a organizaci eventů, které podporují rozvoj klientů i růst firmy. Cílem je udržitelný růst této oblasti při zachování vysoké kvality a maržovosti.Klíčovou součástí je efektivní koordinace školení a eventů – od plánování přes realizaci až po vyhodnocení. Důležité je dodržování termínů, naplněnost školení a transparentní přehled o nákladech, cenotvorbě a maržích.T&E zároveň aktivně pracuje na rozvoji nabídky – pravidelně aktualizuje portfolio školení, přináší nové formáty a inovuje obsah tak, aby odpovídal aktuálním potřebám trhu. Cílem je nejen růst revenue, ale i rozšiřování klientské základny a zvyšování hodnoty poskytovaných služeb.Oblast funguje s důrazem na vlastní odpovědnost za výkon a ekonomické výsledky. Revenue, marže a efektivita jsou klíčové metriky, které určují úspěch T&E a jeho další rozvoj.Bez aktivního rozvoje hrozí stagnace, zpomalení inovací a oslabení vztahů s klienty. Proto je důležité T&E neustále posouvat, rozvíjet a přizpůsobovat trhu."},
  {label:"Sales", color:"green", desc:"Sales v našem kontextu není jen o „prodeji“, ale hlavně o budování dlouhodobých vztahů s klienty a hledání příležitostí, kde dokážeme přinést hodnotu.Součástí je aktivní vyhledávání nových projektů (lead generation), práce se stávajícími klienty a rozvoj spolupráce. Důležité je pochopit potřeby zákazníka a navrhnout řešení, které dává smysl jak z business, tak technologického pohledu.Sales zahrnuje i konzultace, workshopy a prezentaci našich služeb. Nejde jen o získání zakázky, ale o to být pro klienta partnerem, kterému věří a ke kterému se vrací.Velkou roli hraje také rozvoj existujících účtů – hledání nových příležitostí u současných klientů, rozšiřování spolupráce a zvyšování celkové hodnoty projektů.Cílem je nejen růst revenue, ale i otevírání nových rolí, služeb a příležitostí pro celý tým. Sales tak přímo ovlivňuje, na jakých projektech budeme pracovat a kam se firma posune dál."},
  {label:"People Care", color:"green", desc: "People Care se zaměřuje na prostředí pro lidi, jejich spokojenost a rozvoj. Klíčová je automatizace a zjednodušení procesů, stabilizace Delivery (adaptace, review, snížení fluktuace) a nastavení jasných pravidel fungování v Operations včetně feedbacku, odměňování a rozvoje."},
  {label:"Office Management", color:"green", desc: "Office Management zajišťuje hladký chod kanceláře a odstraňuje překážky v práci. Zaměřuje se na standardizaci pracovního prostředí, přehledné procesy a organizaci vybavení. Důležitá je prevence problémů, dostupnost materiálu bez výpadků a prostředí, kde se lidem dobře pracuje."},
  {label:"Marketing", color:"green", desc: "Marketing zajišťuje veškerou externí komunikaci firmy a pomáhá budovat její značku, expertní pozici a povědomí na trhu. Klíčovou roli hraje v generování nových obchodních příležitostí (lead generation) a podpoře businessu.Součástí marketingu je správa sociálních sítí, webu a online kampaní, stejně jako tvorba obsahu a promo materiálů. Marketing také úzce spolupracuje na eventech, školeních a aktivitách spojených s employer brandingem, které pomáhají přitahovat nové kandidáty i klienty.Hlavním cílem pro rok 2026 je strategický rozvoj značky Teseny a posílení její expertní identity. Marketing se zaměřuje na generování kvalifikovaných leadů napříč oblastmi, jako je bodyshop, nové produkty a služby nebo training & events.Důležitou součástí je také rozvoj online kanálů – zvyšování engagementu na sociálních sítích, růst počtu sledujících, pravidelná publikace obsahu a zlepšování výkonu kampaní (např. PPC). Cílem je zvýšit návštěvnost webu, zájem o služby a celkovou viditelnost firmy.Marketing tak propojuje brand, business a komunitu a pomáhá firmě růst jak z pohledu klientů, tak talentů."},
  {label:"Finance", color:"green", desc: "Finance zajišťují, aby peněžní toky ve firmě fungovaly správně, včas a bez chyb, a aby čísla dávala reálný obraz o výkonu firmy. Cílem je mít jasný přehled o tom, kde firma je, jak si vede a kam směřuje, a to díky kvalitnímu reportingu, plánování a controllingu.Důležitou součástí je řízení celého finančního cyklu. To zahrnuje včasné vystavování faktur klientům, kontrolu jejich úhrad a práci s pohledávkami, stejně jako evidenci nákladů a zajištění včasných plateb dodavatelům. Klíčové je dodržování termínů, přesnost a minimalizace chyb, protože finance přímo ovlivňují cash flow firmy.Finance také zajišťují kompletní mzdovou agendu, včetně správného výpočtu mezd a odvodů, a poskytují podklady pro plánování a řízení mzdových nákladů. Díky tomu mají ostatní týmy oporu v datech při rozhodování.Velký důraz je kladen na sledování a řízení klíčových ukazatelů, jako je hrubá marže a billability. Tyto metriky přímo ovlivňují výkonnost firmy a jsou řízeny pomocí pravidelného monitoringu, plánování a úprav cen, kapacit nebo nákladů.Finance zároveň podporují strategické rozhodování tím, že propojují data z různých oblastí firmy a pomáhají identifikovat příležitosti i rizika. Cílem je zajistit stabilní, transparentní a dlouhodobě udržitelné fungování firmy."},
  {label:"Delivery", color:"green", desc: "Delivery se zaměřuje na efektivní využití kapacit a práci s lavičkou (bench). Cílem je lepší monitoring billability, zjednodušení spolupráce s OPS a automatizace procesů (např. nástup na bench), aby se snížila manuální práce a zvýšila efektivita."},

// CREATE CIRCLES
const container = document.getElementById("circles");

activities.forEach(a => {
  const div = document.createElement("div");
  div.dataset.label = a.label;
  div.className = `circle ${a.color}`;
  div.draggable = true;
  if (a.desc) {
  div.style.cursor = "pointer";
  div.classList.add("has-desc");
} else {
  div.style.cursor = "grab";
}
  // 👉 klik = otevře panel
  div.onclick = () => {
    if (!a.desc) return;

    document.getElementById("panelTitle").innerText = a.label;
    document.getElementById("panelText").innerText = a.desc;

    document.getElementById("sidePanel").classList.add("open");
  };

  // 👉 obsah kolečka
  div.innerHTML = `
    ${a.icon 
      ? `<img src="${a.icon}">` 
      : `<span style="color:white;font-size:10px;text-align:center">${a.label}</span>`
    }
    <div class="tooltip-small">${a.label}</div>
  `;

  // 👉 drag
  div.ondragstart = e => {
    e.dataTransfer.setData("text/html", div.outerHTML);
  };

  container.appendChild(div);
});

// GRID
const grid = document.getElementById("grid");

for (let i = 0; i < 16; i++) {
  const box = document.createElement("div");
  box.className = "box";

  box.ondragover = e => e.preventDefault();

  box.ondrop = e => {
    e.preventDefault();
    if (box.children.length > 0) return;

    const data = e.dataTransfer.getData("text/html");
    box.innerHTML = data;

    const circle = box.querySelector(".circle");

  circle.onclick = () => {
    const clone = circle.cloneNode(true);

    // znovu nastavit drag
    clone.draggable = true;
    clone.ondragstart = ev => {
      ev.dataTransfer.setData("text/html", clone.outerHTML);
    };

    document.getElementById("circles").appendChild(clone);

    box.innerHTML = "";
  };
    };

  grid.appendChild(box);
}

// SAVE
async function save() {
  const name = document.getElementById("name").value;
  const other = document.getElementById("other").value;

  if (!name) {
    alert("Zadej jméno");
    return;
  }

  const boxes = document.querySelectorAll(".box");

  for (let b of boxes) {
    const activity = b.querySelector(".circle")?.dataset.label;

    if (activity) {
      console.log("UKLÁDÁM:", activity);

      const { error } = await supabase.from('okr').insert({
        name: name,
        activity: activity,
        other: other
      });

      if (error) {
        console.error("❌ ERROR:", error);
        alert("Chyba při ukládání");
        return;
      }
    }
  }

  alert("Uloženo 🚀");
}
